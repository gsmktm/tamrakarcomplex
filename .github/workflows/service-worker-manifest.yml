name: Service Worker Manifest Regression

on:
  pull_request:
    paths:
      - "public/sw.js"
      - "tests/service-worker-manifest.test.cjs"
      - ".github/workflows/service-worker-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify service worker manifest freshness offline
        run: node --test tests/service-worker-manifest.test.cjs
