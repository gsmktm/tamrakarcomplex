name: Cart Storage Recovery Regression

on:
  pull_request:
    paths:
      - "src/contexts/CartContext.tsx"
      - "src/lib/cartStorage.ts"
      - "src/lib/cartStorage.test.ts"
      - ".github/workflows/cart-storage-recovery-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cart-storage-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore malformed and valid cart snapshots safely
        run: npx vitest run src/lib/cartStorage.test.ts
