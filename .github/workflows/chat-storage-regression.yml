name: Chat Browser Storage Regression

on:
  pull_request:
    paths:
      - "src/components/chat/ChatWidget.tsx"
      - "src/lib/chatClientStorage.ts"
      - "src/test/chatClientStorage.test.ts"
      - ".github/workflows/chat-storage-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify chat storage fallback and normal persistence
        run: npx vitest run src/test/chatClientStorage.test.ts
