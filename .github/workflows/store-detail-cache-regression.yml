name: Store Detail Cache Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/hooks/storeDetailQueryKey.ts"
      - "src/hooks/storeDetailQueryKey.test.ts"
      - "src/hooks/useStoreDirectory.ts"
      - ".github/workflows/store-detail-cache-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-detail-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run zone cache regression tests
        run: npx vitest run src/hooks/storeDetailQueryKey.test.ts
