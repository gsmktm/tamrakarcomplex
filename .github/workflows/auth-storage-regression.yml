name: Auth Browser Storage Regression

on:
  pull_request:
    paths:
      - "src/pages/Auth.tsx"
      - "src/lib/authClientStorage.ts"
      - "src/test/authClientStorage.test.ts"
      - ".github/workflows/auth-storage-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify blocked-storage and normal auth client behavior
        run: npx vitest run src/test/authClientStorage.test.ts
