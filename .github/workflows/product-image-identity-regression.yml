name: Product Image Identity Regression

on:
  pull_request:
    paths:
      - "src/lib/productPresentation.ts"
      - "src/lib/productPresentation.imageGuard.test.ts"
      - ".github/workflows/product-image-identity-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reject wrong-model catalog artwork
        run: npx vitest run src/lib/productPresentation.imageGuard.test.ts
