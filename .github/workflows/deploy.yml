name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REQUIRE_SUBSCRIPTION: "true"
          SITE_URL: ${{ secrets.SITE_URL }}
          NODE_ENV: production

      - name: Prepare cPanel bundle
        run: node scripts/prepare-cpanel.cjs
        env:
          # Public Vite build config; never print values or commit an env file.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to cPanel via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          source: "cpanel-deploy-ready/*"
          target: "${{ secrets.CPANEL_REMOTE_PATH }}"
          strip_components: 1
          rm: false

      - name: Restart Node app on cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.CPANEL_REMOTE_PATH }}
            npm ci --omit=dev
            # If using cPanel Node.js selector, restart via passenger or pm2
            if command -v pm2 &> /dev/null; then
              pm2 restart tamrakar || pm2 start server.cjs --name tamrakar
            elif [ -f ".htaccess" ]; then
              touch tmp/restart.txt
            fi
            echo "Deployment complete at $(date)"
