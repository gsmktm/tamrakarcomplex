name: Missing Vite Asset Fallback Regression

on:
  pull_request:
    paths:
      - "server.cjs"
      - "tests/spa-missing-assets.test.cjs"
      - ".github/workflows/spa-missing-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  missing-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify missing Vite assets never receive SPA HTML
        run: node --test tests/spa-missing-assets.test.cjs
