name: Repair Confirmation Integrity Regression

on:
  pull_request:
    paths:
      - "src/pages/BookingSuccess.tsx"
      - "src/lib/repairConfirmation.ts"
      - "src/lib/repairConfirmation.test.ts"
      - ".github/workflows/repair-confirmation-integrity.yml"

permissions:
  contents: read

jobs:
  repair-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund
      - name: Reject forged booking confirmations
        run: npx vitest run src/lib/repairConfirmation.test.ts
      - name: Verify production Vite bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REQUIRE_SUBSCRIPTION: "true"
          SITE_URL: ${{ secrets.SITE_URL }}
          NODE_ENV: production
