name: Public Store Detail Visibility Regression

on:
  pull_request:
    paths:
      - "src/services/storeDirectoryService.ts"
      - "src/pages/StoreDetail.tsx"
      - "src/test/publicStoreDetailVisibility.test.ts"
      - ".github/workflows/public-store-detail-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-store-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify public store detail fail-closed behavior
        run: npx vitest run src/test/publicStoreDetailVisibility.test.ts
