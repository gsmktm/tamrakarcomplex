name: Storefront regression

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/typecheck-inventory.cjs"
      - "scripts/schema-type-drift.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storefront-regression.yml"

permissions:
  contents: read

jobs:
  vite-build:
    name: Vite production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  unit-and-routes:
    name: Unit tests and routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-routes

  typecheck-inventory:
    name: Diagnostic only · strict TypeScript error inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Inventory existing type errors (does not waive mandatory CI)
        run: node scripts/typecheck-inventory.cjs --report-only
      - name: Inventory checked-in schema type drift (diagnostic only)
        run: node scripts/schema-type-drift.cjs
      - name: Upload classified compiler diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: typescript-inventory
          path: |
            artifacts/typescript-inventory.*
            artifacts/schema-type-drift.*
          retention-days: 7

# These checks intentionally run independently of strict TypeScript checks.
# The original CI type-check remains mandatory and is not disabled.
