name: Storefront regression

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storefront-regression.yml"

permissions:
  contents: read

jobs:
  vite-build:
    name: Vite production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  unit-and-routes:
    name: Unit tests and routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-routes

# These checks intentionally run independently of strict TypeScript checks.
# The original CI type-check remains mandatory and is not disabled.
