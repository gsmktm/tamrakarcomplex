name: Theme Storage Resilience Regression

on:
  pull_request:
    paths:
      - "src/hooks/useTheme.tsx"
      - "src/test/theme-storage-resilience.test.tsx"
      - ".github/workflows/theme-storage-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify theme behavior with and without browser storage
        run: npx vitest run src/test/theme-storage-resilience.test.tsx
