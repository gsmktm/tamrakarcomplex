name: Rate Limiter Bucket Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "server.cjs"
      - "tests/rate-limiter-buckets.test.cjs"
      - ".github/workflows/rate-limiter-regression.yml"

permissions:
  contents: read

jobs:
  rate-limiter-buckets:
    name: Rate limiter expiry and throttling (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated regression tests
        run: node --test tests/rate-limiter-buckets.test.cjs
