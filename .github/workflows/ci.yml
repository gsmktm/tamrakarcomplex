name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: "Test · Lint · Build · Routes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keep checks independent so an existing type failure cannot hide later
      # test, lint or migration results. The final gate still fails the job.
      - name: Test TypeScript diagnostic summarizer
        run: node --test scripts/summarize-ts-errors.test.cjs

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: |
          # Preserve the real tsc exit status while making diagnostics actionable.
          set +e
          npx tsc -p tsconfig.app.json --noEmit 2>&1 | tee "$RUNNER_TEMP/tsc.log"
          type_status=${PIPESTATUS[0]}
          set -e
          node scripts/summarize-ts-errors.cjs "$RUNNER_TEMP/tsc.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$type_status"

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Route consistency check
        id: routes
        continue-on-error: true
        run: npm run check-routes

      - name: Migration safety check
        id: migrations
        continue-on-error: true
        run: npm run check:migrations

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REQUIRE_SUBSCRIPTION: "true"
          SITE_URL: ${{ secrets.SITE_URL }}
          NODE_ENV: production

      - name: Chrome smoke check
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run chrome:check

      - name: Enforce every quality gate
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          ROUTES: ${{ steps.routes.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          failed=0
          for name in TYPECHECK LINT TESTS ROUTES MIGRATIONS BUILD BROWSER; do
            status="${!name}"
            echo "${name}: ${status}"
            if [ "${status}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more required quality gates failed or were skipped."
            exit 1
          fi

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
