name: Sitemap Upstream Reliability Regression

on:
  pull_request:
    paths:
      - "server.cjs"
      - "tests/sitemap-upstream.test.cjs"
      - ".github/workflows/sitemap-upstream-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sitemap error and cache isolation offline
        run: node --test tests/sitemap-upstream.test.cjs
