name: Admin Search Stale RPC Regression

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/components/admin/AdminGlobalSearch.tsx"
      - "src/components/admin/AdminGlobalSearch.test.tsx"
      - ".github/workflows/admin-search-stale-regression.yml"

jobs:
  stale-rpc-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run src/components/admin/AdminGlobalSearch.test.tsx
