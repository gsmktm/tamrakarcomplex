<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Tamrakar Complex{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="{{ url_for('index') }}">Tamrakar Complex</a>
        <nav class="nav">
          <a href="{{ url_for('exchange') }}">Exchange Valuation</a>
          <a href="{{ url_for('prices') }}">Price Insights</a>
          <a href="{{ url_for('deep_search') }}">Deep Search</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ current_year }} Tamrakar Complex. Crafted for Nepal's smart device market.</p>
      </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
